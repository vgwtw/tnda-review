var ITER = 300000;
function b64bytes(s) {
  var bin = atob(s), a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var err = document.getElementById('err');
  err.textContent = '';
  var pw = document.getElementById('pw').value;
  var data = b64bytes(PAYLOAD);
  var salt = data.slice(0, 16), nonce = data.slice(16, 28), ct = data.slice(28);
  crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
    .then(function (km) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    })
    .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct); })
    .then(function (pt) {
      var html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    })
    .catch(function () { err.textContent = '密碼錯誤，請再試一次'; });
});
